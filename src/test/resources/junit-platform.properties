# ===================================================================
# Configuracion unica de JUnit Platform + Cucumber
# -------------------------------------------------------------------
# Nota tecnica: con el motor cucumber-junit-platform-engine la
# configuracion efectiva se lee de este archivo (junit-platform.properties).
# Si se dejara la configuracion en "cucumber.properties", el motor de
# JUnit Platform la ignoraria y solo se aplicarian los plugins por defecto.
# ===================================================================

# ---------- JUnit 5 ----------
junit.jupiter.execution.parallel.enabled=false
junit.jupiter.testinstance.lifecycle.default=per_method

# ---------- Cucumber: ubicacion de los .feature y de los step definitions ----------
# La propiedad cucumber.features es necesaria porque, sin ella, el motor de
# Cucumber para JUnit Platform no descubre los archivos .feature al ejecutarse
# desde Maven (solo descubre clases de test).
cucumber.features=features
cucumber.glue=com.empresa.pruebas.bdd.pasos
cucumber.execution.dry-run=false

# ---------- Plugins de Cucumber (separados por coma, sin espacios) ----------
# pretty -> salida legible en la consola del pipeline
# html   -> reporte navegable oficial de Cucumber
# json   -> resultados crudos que consume el dashboard de metricas
cucumber.plugin=pretty,html:target/cucumber-report/cucumber-report.html,json:target/cucumber-results.json

# ---------- Otros ajustes ----------
# Evita el banner de "Publishing report" al terminar la ejecucion
cucumber.publish.quiet=true
# Ejecucion paralela de escenarios (acelera el pipeline y demuestra atomicidad)
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=dynamic
cucumber.execution.parallel.config.max-pool-size=4

# ---------- Etiquetas para ejecutar por separado cada tipo de prueba ----------
#   solo unitarias -> mvn test -Dgroups=unit -Dcucumber.filter.tags="not @bdd"
#   solo BDD       -> mvn verify -Dgroups=bdd -Dcucumber.filter.tags="@bdd"
# La etiqueta @unit se aplica en el codigo de test y @bdd en los .feature.
